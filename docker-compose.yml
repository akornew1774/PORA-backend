services:
  postgres:
    image: postgres:16

    container_name: pora-postgres

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: pora-backend

    env_file:
      - .env
    
    volumes:
      - ./.env:/app/.env:ro

    environment:
      DB_HOST: postgres

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "5040:5040"

    restart: unless-stopped

volumes:
  postgres_data: